<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="p-bg-dev" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151A1D" />
      <stop offset="100%" stop-color="#090C0E" />
    </linearGradient>
    <radialGradient id="p-glow-dev" cx="40%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#F4C542" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#F4C542" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="400" height="480" fill="url(#p-bg-dev)" />
  <rect width="400" height="480" fill="url(#p-glow-dev)" />

  <!-- Geometric Grid & Reticles -->
  <g stroke="#222A2E" stroke-width="1">
    <line x1="30" y1="0" x2="30" y2="480" stroke-dasharray="4 4" />
    <line x1="370" y1="0" x2="370" y2="480" stroke-dasharray="4 4" />
    <line x1="0" y1="360" x2="400" y2="360" />
  </g>

  <!-- Editorial Silhouette & Lighting -->
  <g transform="translate(100, 70)">
    <circle cx="100" cy="80" r="54" fill="#1A2124" stroke="#F4C542" stroke-width="1.5" />
    <path d="M 30,220 C 30,150 80,140 100,140 C 120,140 170,150 170,220 Z" fill="#12171A" stroke="#2D373B" stroke-width="1.5" />
    <!-- Executive Visor / Leader accent -->
    <rect x="76" y="74" width="48" height="12" rx="2" fill="#0E1214" stroke="#F4C542" stroke-width="1.5" />
    <line x1="100" y1="74" x2="100" y2="86" stroke="#F4C542" />
    <path d="M 85,140 L 100,170 L 115,140" stroke="#F4C542" stroke-width="1.5" fill="none" />
  </g>

  <!-- Badge Metadata Overlay -->
  <g transform="translate(30, 380)">
    <text x="0" y="20" font-family="'JetBrains Mono', monospace" font-size="11" fill="#F4C542" font-weight="bold">PANEL FILE // 01</text>
    <text x="0" y="46" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="800" fill="#F2F0E8">DEVANSH</text>
    <text x="0" y="68" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8D9699">PRESIDENT // STRATEGY &amp; DIRECTION</text>
  </g>

  <!-- Corner Brackets -->
  <g stroke="#F4C542" stroke-width="1.5" fill="none">
    <path d="M 15,30 L 15,15 L 30,15" />
    <path d="M 385,30 L 385,15 L 370,15" />
    <path d="M 15,450 L 15,465 L 30,465" />
    <path d="M 385,450 L 385,465 L 370,465" />
  </g>
</svg>
