<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="aa-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14191C" />
      <stop offset="100%" stop-color="#080B0D" />
    </linearGradient>
    <radialGradient id="aa-amb" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#F4C542" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#F4C542" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#aa-bg)" />
  <rect width="800" height="500" fill="url(#aa-amb)" />

  <!-- Code Matrix & Binary Tree Arena Visual -->
  <g transform="translate(160, 60)">
    <!-- Binary Tree Graph -->
    <g stroke="#F4C542" stroke-width="1.5" fill="none">
      <circle cx="240" cy="40" r="16" fill="#151A1C" />
      <circle cx="140" cy="110" r="14" fill="#151A1C" />
      <circle cx="340" cy="110" r="14" fill="#151A1C" />
      <circle cx="80" cy="180" r="12" fill="#151A1C" />
      <circle cx="200" cy="180" r="12" fill="#151A1C" stroke="#58D8D5" />
      <circle cx="280" cy="180" r="12" fill="#151A1C" stroke="#58D8D5" />
      <circle cx="400" cy="180" r="12" fill="#151A1C" />

      <line x1="240" y1="56" x2="140" y2="96" />
      <line x1="240" y1="56" x2="340" y2="96" />
      <line x1="140" y1="124" x2="80" y2="168" />
      <line x1="140" y1="124" x2="200" y2="168" stroke="#58D8D5" />
      <line x1="340" y1="124" x2="280" y2="168" stroke="#58D8D5" />
      <line x1="340" y1="124" x2="400" y2="168" />
    </g>

    <!-- Code Benchmark HUD -->
    <rect x="20" y="220" width="440" height="70" rx="3" fill="#0A0D0F" stroke="#252D30" />
    <text x="35" y="245" font-family="'JetBrains Mono', monospace" font-size="11" fill="#58D8D5">TIME COMPLEXITY: O(N log N) | MEM: 4.2 MB | 100/100 AC</text>
    <text x="35" y="270" font-family="'JetBrains Mono', monospace" font-size="11" fill="#F4C542">SPEED LEADERBOARD: 1. TEAM_TURING [0.012s]  2. SATA_NINJA [0.015s]</text>
  </g>

  <!-- Overlay Box -->
  <rect x="80" y="380" width="640" height="85" rx="4" fill="#0D1113" stroke="#252D30" />
  <text x="105" y="415" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="bold" fill="#F2F0E8">ALGORITHMIC ARENA &apos;25</text>
  <text x="105" y="445" font-family="'JetBrains Mono', monospace" font-size="12" fill="#F4C542">COMPETITIVE SYSTEMS SPRINT // DYNAMIC PROGRAMMING // 96 PARTICIPANTS</text>
  <text x="610" y="430" font-family="'JetBrains Mono', monospace" font-size="12" fill="#58D8D5">AUG 2025</text>
</svg>
