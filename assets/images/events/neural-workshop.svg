<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="nw-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101518" />
      <stop offset="100%" stop-color="#080B0D" />
    </linearGradient>
    <radialGradient id="nw-cyan" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#58D8D5" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#58D8D5" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#nw-bg)" />
  <rect width="800" height="500" fill="url(#nw-cyan)" />

  <!-- Neural Net Visual -->
  <g stroke="#252D30" stroke-width="1" stroke-dasharray="4 4">
    <line x1="100" y1="0" x2="100" y2="500" />
    <line x1="700" y1="0" x2="700" y2="500" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="400" x2="800" y2="400" />
  </g>

  <!-- Neural Nodes & Weights -->
  <g transform="translate(150, 80)">
    <!-- Layer 1 -->
    <circle cx="80" cy="80" r="14" fill="#151A1C" stroke="#58D8D5" stroke-width="2" />
    <circle cx="80" cy="180" r="14" fill="#151A1C" stroke="#58D8D5" stroke-width="2" />
    <circle cx="80" cy="280" r="14" fill="#151A1C" stroke="#58D8D5" stroke-width="2" />

    <!-- Layer 2 -->
    <circle cx="260" cy="50" r="14" fill="#151A1C" stroke="#58D8D5" stroke-width="2" />
    <circle cx="260" cy="130" r="14" fill="#151A1C" stroke="#F4C542" stroke-width="2" />
    <circle cx="260" cy="210" r="14" fill="#151A1C" stroke="#58D8D5" stroke-width="2" />
    <circle cx="260" cy="290" r="14" fill="#151A1C" stroke="#F4C542" stroke-width="2" />

    <!-- Layer 3 Output -->
    <circle cx="440" cy="120" r="16" fill="#151A1C" stroke="#58D8D5" stroke-width="2.5" />
    <circle cx="440" cy="240" r="16" fill="#151A1C" stroke="#58D8D5" stroke-width="2.5" />

    <!-- Interconnects -->
    <g stroke="#58D8D5" stroke-width="1.2" opacity="0.6">
      <line x1="80" y1="80" x2="260" y2="50" />
      <line x1="80" y1="80" x2="260" y2="130" />
      <line x1="80" y1="80" x2="260" y2="210" />
      <line x1="80" y1="180" x2="260" y2="130" stroke="#F4C542" />
      <line x1="80" y1="180" x2="260" y2="210" />
      <line x1="80" y1="280" x2="260" y2="210" />
      <line x1="80" y1="280" x2="260" y2="290" stroke="#F4C542" />

      <line x1="260" y1="50" x2="440" y2="120" />
      <line x1="260" y1="130" x2="440" y2="120" stroke="#F4C542" />
      <line x1="260" y1="210" x2="440" y2="240" />
      <line x1="260" y1="290" x2="440" y2="240" stroke="#F4C542" />
    </g>
  </g>

  <!-- Overlay Box -->
  <rect x="80" y="380" width="640" height="85" rx="4" fill="#0D1113" stroke="#252D30" />
  <text x="105" y="415" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="bold" fill="#F2F0E8">NEURAL SYSTEMS &amp; EDGE AI</text>
  <text x="105" y="445" font-family="'JetBrains Mono', monospace" font-size="12" fill="#58D8D5">WORKSHOP // INT8 QUANTIZATION &amp; NPU FLASHING // 84 ATTENDEES</text>
  <text x="610" y="430" font-family="'JetBrains Mono', monospace" font-size="12" fill="#F4C542">JAN 2026</text>
</svg>
