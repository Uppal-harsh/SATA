<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="p1-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12181A" />
      <stop offset="100%" stop-color="#080B0D" />
    </linearGradient>
    <radialGradient id="p1-cyan" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#58D8D5" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#58D8D5" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="600" height="380" fill="url(#p1-bg)" stroke="#252D30" stroke-width="1.5" />
  <rect width="600" height="380" fill="url(#p1-cyan)" />

  <!-- Drone / Atmospheric Flight Telemetry Blueprint -->
  <g transform="translate(100, 40)">
    <!-- Quadcopter Schematics -->
    <g stroke="#58D8D5" stroke-width="1.8" fill="none">
      <!-- Body -->
      <polygon points="200,80 220,120 180,120" fill="#151A1C" />
      <line x1="200" y1="100" x2="110" y2="40" />
      <line x1="200" y1="100" x2="290" y2="40" />
      <line x1="200" y1="100" x2="110" y2="160" />
      <line x1="200" y1="100" x2="290" y2="160" />

      <!-- Rotors -->
      <ellipse cx="110" cy="40" rx="36" ry="12" stroke="#F4C542" stroke-dasharray="3 3" />
      <ellipse cx="290" cy="40" rx="36" ry="12" stroke="#F4C542" stroke-dasharray="3 3" />
      <ellipse cx="110" cy="160" rx="36" ry="12" stroke="#F4C542" stroke-dasharray="3 3" />
      <ellipse cx="290" cy="160" rx="36" ry="12" stroke="#F4C542" stroke-dasharray="3 3" />
      
      <!-- Sensor Probe Beam -->
      <line x1="200" y1="120" x2="200" y2="200" stroke="#58D8D5" stroke-dasharray="2 4" />
      <polygon points="194,196 200,208 206,196" fill="#58D8D5" />
    </g>

    <!-- Air Quality Sensor Readouts -->
    <g transform="translate(40, 220)">
      <rect x="0" y="0" width="320" height="40" rx="2" fill="#0A0D0F" stroke="#252D30" />
      <text x="12" y="24" font-family="'JetBrains Mono', monospace" font-size="10" fill="#58D8D5">PM2.5: 18.4 µg/m³ | VOC: 42 ppb | ALT: 48.2m</text>
    </g>
  </g>

  <!-- Project Header Bar -->
  <rect x="20" y="290" width="560" height="70" rx="4" fill="#0E1315" stroke="#252D30" />
  <text x="35" y="320" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="bold" fill="#F2F0E8">AeroSense — Autonomous Drone Telemetry</text>
  <text x="35" y="344" font-family="'JetBrains Mono', monospace" font-size="11" fill="#58D8D5">RUST / C++ // ESP32-S3 // AIR QUALITY SENSOR FUSION</text>
</svg>
