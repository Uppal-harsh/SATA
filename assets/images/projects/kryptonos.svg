<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="p2-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14181A" />
      <stop offset="100%" stop-color="#080B0D" />
    </linearGradient>
    <radialGradient id="p2-amber" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#F4C542" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#F4C542" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="600" height="380" fill="url(#p2-bg)" stroke="#252D30" stroke-width="1.5" />
  <rect width="600" height="380" fill="url(#p2-amber)" />

  <!-- Microkernel Architecture Schematic -->
  <g transform="translate(100, 35)">
    <!-- Kernel Space -->
    <rect x="0" y="0" width="400" height="60" rx="3" fill="#151A1C" stroke="#F4C542" stroke-width="2" />
    <text x="110" y="36" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="bold" fill="#F4C542">KRYPTON MICROKERNEL CORE (RUST)</text>
    
    <!-- IPC Bus -->
    <line x1="200" y1="60" x2="200" y2="100" stroke="#58D8D5" stroke-width="2" stroke-dasharray="4 2" />
    <line x1="80" y1="100" x2="320" y2="100" stroke="#58D8D5" stroke-width="2" />
    
    <!-- User-Space Servers -->
    <rect x="20" y="115" width="100" height="55" rx="3" fill="#0E1214" stroke="#58D8D5" stroke-width="1.2" />
    <text x="35" y="145" font-family="'JetBrains Mono', monospace" font-size="10" fill="#F2F0E8">FS SERVER</text>

    <rect x="150" y="115" width="100" height="55" rx="3" fill="#0E1214" stroke="#58D8D5" stroke-width="1.2" />
    <text x="162" y="145" font-family="'JetBrains Mono', monospace" font-size="10" fill="#F2F0E8">NET STACK</text>

    <rect x="280" y="115" width="100" height="55" rx="3" fill="#0E1214" stroke="#58D8D5" stroke-width="1.2" />
    <text x="290" y="145" font-family="'JetBrains Mono', monospace" font-size="10" fill="#F2F0E8">SCHEDULER</text>

    <line x1="70" y1="100" x2="70" y2="115" stroke="#58D8D5" stroke-width="1.5" />
    <line x1="200" y1="100" x2="200" y2="115" stroke="#58D8D5" stroke-width="1.5" />
    <line x1="330" y1="100" x2="330" y2="115" stroke="#58D8D5" stroke-width="1.5" />

    <!-- Performance Metric -->
    <g transform="translate(40, 195)">
      <rect x="0" y="0" width="320" height="35" rx="2" fill="#0A0D0F" stroke="#252D30" />
      <text x="12" y="22" font-family="'JetBrains Mono', monospace" font-size="10" fill="#F4C542">CONTEXT SWITCH: 180ns // MEMORY FOOTPRINT: 64KB</text>
    </g>
  </g>

  <!-- Project Header Bar -->
  <rect x="20" y="290" width="560" height="70" rx="4" fill="#0E1315" stroke="#252D30" />
  <text x="35" y="320" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="bold" fill="#F2F0E8">KryptonOS — Real-Time Microkernel</text>
  <text x="35" y="344" font-family="'JetBrains Mono', monospace" font-size="11" fill="#F4C542">RUST // RISC-V // WEBASSEMBLY SANDBOXING // ZERO-COPY IPC</text>
</svg>
