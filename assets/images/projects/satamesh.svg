<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="p4-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14181B" />
      <stop offset="100%" stop-color="#080B0D" />
    </linearGradient>
    <radialGradient id="p4-amb" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#F4C542" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#F4C542" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="600" height="380" fill="url(#p4-bg)" stroke="#252D30" stroke-width="1.5" />
  <rect width="600" height="380" fill="url(#p4-amb)" />

  <!-- Mesh Network Nodes -->
  <g transform="translate(100, 35)">
    <!-- Nodes -->
    <g stroke="#F4C542" stroke-width="1.5" fill="none">
      <circle cx="80" cy="50" r="16" fill="#151A1C" />
      <circle cx="200" cy="30" r="18" fill="#151A1C" stroke="#58D8D5" />
      <circle cx="320" cy="70" r="16" fill="#151A1C" />
      <circle cx="100" cy="150" r="16" fill="#151A1C" stroke="#58D8D5" />
      <circle cx="230" cy="140" r="20" fill="#151A1C" stroke="#F4C542" stroke-width="2.5" />
      <circle cx="340" cy="160" r="16" fill="#151A1C" />

      <!-- Radio range circles -->
      <circle cx="230" cy="140" r="60" stroke="#F4C542" stroke-dasharray="3 3" opacity="0.4" />
      <circle cx="200" cy="30" r="50" stroke="#58D8D5" stroke-dasharray="3 3" opacity="0.4" />

      <!-- Links -->
      <line x1="80" y1="50" x2="200" y2="30" stroke="#58D8D5" />
      <line x1="200" y1="30" x2="320" y2="70" stroke="#58D8D5" />
      <line x1="80" y1="50" x2="100" y2="150" stroke="#F4C542" />
      <line x1="100" y1="150" x2="230" y2="140" stroke="#F4C542" />
      <line x1="200" y1="30" x2="230" y2="140" stroke="#58D8D5" />
      <line x1="230" y1="140" x2="340" y2="160" stroke="#F4C542" />
      <line x1="320" y1="70" x2="340" y2="160" stroke="#58D8D5" />
    </g>

    <!-- Telemetry -->
    <g transform="translate(40, 195)">
      <rect x="0" y="0" width="320" height="35" rx="2" fill="#0A0D0F" stroke="#252D30" />
      <text x="12" y="22" font-family="'JetBrains Mono', monospace" font-size="10" fill="#58D8D5">LORA 868MHZ // 4.8KM CAMPUS SPAN // ZERO CLOUD DEPENDENCY</text>
    </g>
  </g>

  <!-- Project Header Bar -->
  <rect x="20" y="290" width="560" height="70" rx="4" fill="#0E1315" stroke="#252D30" />
  <text x="35" y="320" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="bold" fill="#F2F0E8">SATAMesh — Campus Decentralized Radio</text>
  <text x="35" y="344" font-family="'JetBrains Mono', monospace" font-size="11" fill="#F4C542">C++ // LORA PROTOCOL // PEER-TO-PEER ENCRYPTED MESSAGING</text>
</svg>
