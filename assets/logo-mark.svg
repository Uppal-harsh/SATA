<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Radial Ambient Glow -->
    <radialGradient id="sata-ambient-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#080B0D" />
      <stop offset="85%" stop-color="#080B0D" />
      <stop offset="100%" stop-color="#080B0D" stop-opacity="0" />
    </radialGradient>

    <!-- Warm Amber Gradient (Left Bulb Side) -->
    <linearGradient id="sata-bulb-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7C844" />
      <stop offset="50%" stop-color="#F5A82A" />
      <stop offset="100%" stop-color="#E88F18" />
    </linearGradient>

    <!-- Cool Cyan Gradient (Right Brain Side) -->
    <linearGradient id="sata-brain-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#72EBE8" />
      <stop offset="50%" stop-color="#51D0CD" />
      <stop offset="100%" stop-color="#34A8A5" />
    </linearGradient>

    <!-- Bulb Base Tip Gradient -->
    <linearGradient id="sata-base-tip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#72EBE8" />
      <stop offset="100%" stop-color="#34A8A5" />
    </linearGradient>

    <!-- Subtle Glow Filters -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Circular Background Badge -->
  <circle cx="250" cy="250" r="240" fill="#080B0D" stroke="#1F2629" stroke-width="1.5" />

  <!-- Outer Segmented / Dashed Circular Framing Line -->
  <circle cx="250" cy="245" r="162" fill="none" stroke="#F2F0E8" stroke-width="2.5" stroke-dasharray="24 16 38 16 12 16" stroke-linecap="round" opacity="0.85" />

  <!-- ================= PERIPHERAL SCIENTIFIC & CREATIVE ICONS ================= -->
  <g stroke="#F2F0E8" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- 1. TOP: PUZZLE PIECE -->
    <g transform="translate(230, 24) scale(0.9)">
      <path d="M 8,0 L 22,0 C 22,0 20,8 27,8 C 34,8 32,0 32,0 L 46,0 L 46,14 C 46,14 54,12 54,19 C 54,26 46,24 46,24 L 46,38 L 32,38 C 32,38 34,46 27,46 C 20,46 22,38 22,38 L 8,38 L 8,24 C 8,24 0,26 0,19 C 0,12 8,14 8,14 Z" />
    </g>

    <!-- 2. TOP-LEFT: ENVELOPE / COMMUNICATION -->
    <g transform="translate(132, 68) scale(0.9)">
      <rect x="0" y="0" width="48" height="32" rx="2" />
      <path d="M 0,0 L 24,18 L 48,0" />
      <line x1="0" y1="32" x2="18" y2="14" />
      <line x1="48" y1="32" x2="30" y2="14" />
    </g>

    <!-- 3. MIDDLE-LEFT: MAGNIFYING GLASS / RESEARCH -->
    <g transform="translate(86, 172) scale(0.95)">
      <circle cx="20" cy="20" r="18" />
      <circle cx="20" cy="20" r="13" stroke-width="1.8" />
      <line x1="33" y1="33" x2="48" y2="48" stroke-width="4.5" />
      <rect x="16" y="48" width="8" height="24" rx="2" fill="#F2F0E8" />
    </g>

    <!-- 4. BOTTOM-LEFT: ERLENMEYER FLASK / SCIENCE -->
    <g transform="translate(98, 285) scale(0.95)">
      <path d="M 20,0 L 32,0 M 26,0 L 26,20 L 4,68 C 2,72 5,76 10,76 L 42,76 C 47,76 50,72 48,68 L 26,20" />
      <line x1="12" y1="56" x2="40" y2="56" stroke-width="2" stroke-dasharray="4 3" />
      <circle cx="26" cy="42" r="2.5" fill="#F2F0E8" />
      <circle cx="34" cy="64" r="3" fill="#F2F0E8" />
      <circle cx="20" cy="66" r="2" fill="#F2F0E8" />
    </g>

    <!-- 5. TOP-RIGHT: INTERLOCKING GEARS / ENGINEERING -->
    <g transform="translate(340, 60) scale(0.85)">
      <!-- Gear 1 (Larger) -->
      <circle cx="24" cy="24" r="18" />
      <circle cx="24" cy="24" r="7" fill="#080B0D" stroke-width="2.5" />
      <path d="M 24,2 L 24,6 M 24,42 L 24,46 M 2,24 L 6,24 M 42,24 L 46,24 M 8,8 L 12,12 M 36,36 L 40,40 M 8,40 L 12,36 M 36,8 L 40,12" stroke-width="4" />
      
      <!-- Gear 2 (Smaller Interlocked) -->
      <g transform="translate(42, 28)">
        <circle cx="16" cy="16" r="12" />
        <circle cx="16" cy="16" r="4.5" fill="#080B0D" stroke-width="2" />
        <path d="M 16,1 L 16,4 M 16,28 L 16,31 M 1,16 L 4,16 M 28,16 L 31,16 M 5,5 L 8,8 M 24,24 L 27,27 M 5,27 L 8,24 M 24,5 L 27,8" stroke-width="3" />
      </g>
    </g>

    <!-- 6. MIDDLE-RIGHT: PENCIL / DRAFTING & DESIGN -->
    <g transform="translate(390, 175) scale(0.95)">
      <rect x="8" y="0" width="22" height="52" rx="2" />
      <line x1="15" y1="0" x2="15" y2="52" stroke-width="1.8" />
      <line x1="23" y1="0" x2="23" y2="52" stroke-width="1.8" />
      <path d="M 8,52 L 19,72 L 30,52 Z" />
      <path d="M 16,66 L 19,72 L 22,66 Z" fill="#F2F0E8" />
    </g>

    <!-- 7. BOTTOM-RIGHT: HOURGLASS / TIME & EFFICIENCY -->
    <g transform="translate(378, 290) scale(0.95)">
      <rect x="4" y="0" width="44" height="6" rx="2" fill="#F2F0E8" />
      <rect x="4" y="66" width="44" height="6" rx="2" fill="#F2F0E8" />
      <path d="M 10,6 L 42,6 L 27,36 L 42,66 L 10,66 L 25,36 Z" />
      <!-- Sand inside -->
      <polygon points="18,16 34,16 26,30" fill="#F2F0E8" />
      <polygon points="14,62 38,62 30,52 22,52" fill="#F2F0E8" />
      <line x1="26" y1="30" x2="26" y2="52" stroke-dasharray="2 3" stroke-width="2" />
    </g>
  </g>

  <!-- ================= CENTRAL SPLIT VISUAL: BULB + BRAIN ================= -->
  
  <!-- LEFT HALF: AMBER LIGHT BULB WITH HUMAN FIGURE / FILAMENT -->
  <g id="sata-bulb-half">
    <!-- Amber Half Bulb Body -->
    <path d="M 250,118 C 172,118 152,175 152,228 C 152,274 186,308 206,342 L 250,342 Z" 
          fill="url(#sata-bulb-grad)" stroke="#F2F0E8" stroke-width="3.5" stroke-linejoin="round" />

    <!-- Stylized Human Figure / Filament in Bulb Center -->
    <g stroke="#F2F0E8" stroke-width="3" fill="none" stroke-linecap="round">
      <!-- Head / Bulb Spark -->
      <circle cx="236" cy="235" r="7" stroke-width="3" fill="#F7C844" />
      <!-- Torso / Radiant Beam Arms -->
      <path d="M 236,245 L 236,290 M 218,245 L 236,260 L 250,260" stroke-width="3.2" />
      <path d="M 236,290 L 222,342 M 236,290 L 250,342" stroke-width="3" />
      <line x1="218" y1="245" x2="218" y2="342" stroke-width="2.5" opacity="0.6" />
    </g>
  </g>

  <!-- RIGHT HALF: CYAN NEURAL BRAIN -->
  <g id="sata-brain-half">
    <!-- Cyan Half Brain Silhouette with Lobes -->
    <path d="M 250,118 C 285,118 308,135 308,162 C 308,172 302,182 322,192 C 344,202 368,220 368,252 C 368,284 345,302 328,310 C 318,315 316,332 296,342 L 250,342 Z" 
          fill="url(#sata-brain-grad)" stroke="#F2F0E8" stroke-width="3.5" stroke-linejoin="round" />

    <!-- White Neural Sulci & Gyri Folding Lines -->
    <g stroke="#F2F0E8" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 250,145 C 275,145 288,162 278,182 C 268,202 292,216 308,208" />
      <path d="M 250,195 C 270,195 282,218 270,240 C 260,258 288,272 314,265 C 335,260 348,278 335,296" />
      <path d="M 250,255 C 275,255 285,278 272,300 C 262,318 280,332 294,328" />
      <path d="M 250,310 C 268,310 278,326 270,338" />
      <!-- Branching Synaptic Folds -->
      <path d="M 285,170 Q 305,175 316,162" stroke-width="2.4" />
      <path d="M 295,245 Q 325,240 338,230" stroke-width="2.4" />
      <path d="M 290,290 Q 312,295 320,312" stroke-width="2.4" />
    </g>
  </g>

  <!-- Central Division Line -->
  <line x1="250" y1="116" x2="250" y2="344" stroke="#F2F0E8" stroke-width="4" stroke-linecap="round" />

  <!-- ================= LIGHT BULB SCREW BASE & CONTACT TIP ================= -->
  <g id="sata-bulb-base">
    <!-- Base Shell -->
    <path d="M 206,344 L 294,344 L 284,402 L 216,402 Z" fill="#2E434D" stroke="#F2F0E8" stroke-width="3.5" />
    
    <!-- White Horizontal Metallic Thread Ridges -->
    <line x1="198" y1="358" x2="302" y2="358" stroke="#F2F0E8" stroke-width="6" stroke-linecap="round" />
    <line x1="202" y1="380" x2="298" y2="380" stroke="#F2F0E8" stroke-width="6" stroke-linecap="round" />
    
    <!-- Diagonal Base Structural Pins -->
    <line x1="208" y1="350" x2="208" y2="390" stroke="#F2F0E8" stroke-width="3.5" />
    <line x1="292" y1="350" x2="292" y2="390" stroke="#F2F0E8" stroke-width="3.5" />

    <!-- Bottom Contact Tip (Cyan/Light Blue) -->
    <path d="M 226,404 C 226,420 274,420 274,404 Z" fill="url(#sata-base-tip)" stroke="#F2F0E8" stroke-width="3.5" />
  </g>

</svg>
